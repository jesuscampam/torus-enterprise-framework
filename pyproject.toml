[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
packages = ["backend"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# El framework no usa clases de prueba (solo funciones) — se desactiva la
# recolección basada en clases para que Settings como "TestingSettings" no
# se confundan con clases de test por el prefijo "Test".
python_classes = []
