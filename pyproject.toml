[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teaf"
version = "0.10.0-alpha"
description = "TORUS Enterprise Application Framework — a modular, API-first, Cloud-ready and AI-ready Python framework."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "TORUS" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
# Debe permanecer sincronizado con requirements.txt (fuente usada por
# desarrollo local/CI vía `pip install -r requirements.txt`) — ambos fijan
# las mismas versiones exactas, ver docs/architecture/STACK.md.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    "pyjwt[crypto]==2.13.0",
    "argon2-cffi==23.1.0",
    "bcrypt==4.2.1",
    "ldap3==2.9.1",
    "httpx==0.28.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-exporter-prometheus==0.65b0",
    "prometheus-client==0.26.0",
]

# Sin [project.scripts]: TEAF no ofrece una CLI en este Sprint (ver
# Sprint 2.5.1, "NO IMPLEMENTAR" — sección 13).

[project.urls]
Homepage = "https://github.com/jesuscampam/torus-enterprise-framework"
Documentation = "https://github.com/jesuscampam/torus-enterprise-framework/tree/main/docs"
Changelog = "https://github.com/jesuscampam/torus-enterprise-framework/blob/main/CHANGELOG.md"

# `teaf/` es la única API pública (ver docs/public-api/PUBLIC-API.md);
# la implementación privada vive en `teaf/_internal/` (Sprint 2.6.2, ver
# ADR-006), un subpaquete de `teaf` — no un paquete de nivel superior
# independiente, precisamente para no poder colisionar con un posible
# paquete `backend/` propio de una aplicación consumidora.
[project.optional-dependencies]
# Caché distribuida (Sprint 3.0, ADR-012). Opcional a propósito: TEAF
# funciona sin ella con los almacenes en memoria, y el import de
# ``redis`` es perezoso para que no instalarla nunca rompa el arranque.
redis = ["redis>=5.0,<7.0"]

[tool.setuptools.packages.find]
include = ["teaf*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
teaf = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["teaf", "tests", "examples", "scripts"]
# Revisiones de Alembic generadas por plantilla (script.py.mako) — no se
# reescriben a mano en cada `alembic revision`, así que no se fuerzan a las
# reglas de lint del proyecto (ver docs/modules/database/MIGRATIONS.md).
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 ("no llamar a una función en un valor por defecto") es un falso
# positivo conocido y documentado para FastAPI: ``Depends(...)`` en la firma
# de un endpoint es el idioma estándar de FastAPI, no un bug — ver
# ``current_identity``/``current_principal``/``current_claims``/
# ``current_security_context`` (Sprint 2.7, teaf/_internal/security/dependencies.py)
# y su uso en tests/examples vía ``Depends(current_principal)``.
# UP042 ("hereda de str y Enum, usa enum.StrEnum") describe una convención
# deliberada y uniforme de todo TEAF: las ~27 enumeraciones del framework
# (``CapabilityCategory``, ``ModuleCategory``, ``SpanKind``, ``QuotaPeriod``,
# ...) heredan de ``(str, Enum)`` desde Sprint 2.2. No es deuda pendiente de
# limpiar: ``StrEnum`` cambia el resultado de ``str(miembro)`` (devuelve el
# valor, no ``"Clase.MIEMBRO"``), así que migrar sería un cambio de
# comportamiento repartido por serialización, logs y respuestas HTTP — un
# cambio estructural que exige su propio ADR (CLAUDE.md, sección 12), no un
# efecto colateral de un Sprint funcional. Se ignora la regla, no se
# silencia archivo a archivo, para que la convención quede declarada en un
# único sitio. Ver el reporte del Sprint 2.9: la regla apareció al
# actualizarse ruff, sobre código que ya existía.
ignore = ["B008", "UP042"]

[tool.black]
line-length = 100
target-version = ["py311"]
# Mismo criterio (y misma ruta) que ``[tool.ruff].extend-exclude``: las
# revisiones de Alembic las genera su plantilla (``script.py.mako``), no se
# escriben a mano, y reformatearlas solo produce ruido en el diff que la
# siguiente ``alembic revision`` vuelve a introducir.
force-exclude = "database/migrations/versions"

[tool.mypy]
python_version = "3.11"
packages = ["teaf"]
strict = true
ignore_missing_imports = true

# ``redis`` es un extra opcional (Sprint 3.0, ADR-012): puede no estar
# instalado en el entorno de tipado, y exigir sus stubs para comprobar tipos
# obligaría a instalarlo — justo lo contrario de que sea opcional. El
# aislamiento está acotado a providers/cache/redis.py, que expone hacia fuera
# el contrato tipado ``CacheProvider``.
[[tool.mypy.overrides]]
module = ["redis.*", "redis"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# El framework no usa clases de prueba (solo funciones) — se desactiva la
# recolección basada en clases para que Settings como "TestingSettings" no
# se confundan con clases de test por el prefijo "Test".
python_classes = []
