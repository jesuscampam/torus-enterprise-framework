# TEAF - configuración de Alembic (ver docs/modules/database/MIGRATIONS.md)
# La URL de conexión NUNCA se hardcodea aquí (ver DATABASE-STANDARD.md,
# sección 10, "Credenciales de base de datos en código fuente/archivos
# versionados") — se inyecta en tiempo de ejecución, vía
# ``DatabaseInstaller`` (programático) o la variable de entorno
# ``TEAF_DATABASE_URL`` (CLI directa), ver database/migrations/env.py.

[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
